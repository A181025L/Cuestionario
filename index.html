<body>
  <div class="app-wrapper" id="contenido">
    <header class="site-header" role="banner">
      <div class="logo-mark">v2.1.2</div>
      <a href="" style="text-decoration: none; color: inherit;">
        <h1>NEKO-DOCUMENTAL</h1>
      </a>
      <p class="subtitle">Cuestionarios de estudio por transversal</p>
    </header>

    <main>
      <section class="config" id="configPanel" aria-label="Configuración del cuestionario">

        <section class="config-section">
          <div class="section-label">Modo de estudio</div>
          <div class="modos-grid" id="modosGrid">
            <label class="modo-card" data-modo="todos">
              <input type="radio" name="modo" value="todos" checked />
              <span class="mc-icon">🌐</span>
              <span class="mc-title">Todos los temas</span>
              <span class="mc-desc">Práctica general</span>
            </label>

            <label class="modo-card" data-modo="tema">
              <input type="radio" name="modo" value="tema" />
              <span class="mc-icon">📚</span>
              <span class="mc-title">Tema específico</span>
              <span class="mc-desc">Elige materia y tema</span>
            </label>

            <label class="modo-card" data-modo="por_materia">
              <input type="radio" name="modo" value="por_materia" />
              <span class="mc-icon">🗂️</span>
              <span class="mc-title">Por materia</span>
              <span class="mc-desc">Una o varias materias</span>
            </label>

            <label class="modo-card" data-modo="examen">
              <input type="radio" name="modo" value="examen" />
              <span class="mc-icon">🧾</span>
              <span class="mc-title">Examen</span>
              <span class="mc-desc">Con tiempo límite total</span>
            </label>

            <label class="modo-card modo-nuevo" data-modo="nuevo">
              <input type="radio" name="modo" value="nuevo" />
              <span class="mc-icon">✨</span>
              <span class="mc-title">Nueva modalidad</span>
              <span class="mc-desc">Próximamente</span>
              <span class="badge-pronto">PRONTO</span>
            </label>
          </div>
        </section>

        <section class="modo-opcion" id="opcionTema" style="display:none">
          <div class="section-label">Selección de tema</div>
          <div class="select-row">
            <div class="select-group">
              <label for="materiaParaTema">Materia</label>
              <select id="materiaParaTema"></select>
            </div>
            <div class="select-group">
              <label for="temaSelect">Tema</label>
              <select id="temaSelect"></select>
            </div>
          </div>
        </section>

        <!-- Sub-opciones del modo Examen -->
        <section class="modo-opcion" id="opcionExamen" style="display:none">
          <div class="section-label">Alcance del examen</div>
          <div class="modos-grid alcance-grid" id="examenAlcanceGrid">
            <label class="modo-card active" data-alcance="todas">
              <input type="radio" name="examenAlcance" value="todas" checked />
              <span class="mc-icon">🌐</span>
              <span class="mc-title">Todas las materias</span>
              <span class="mc-desc">Todo el temario</span>
            </label>
            <label class="modo-card" data-alcance="seleccion">
              <input type="radio" name="examenAlcance" value="seleccion" />
              <span class="mc-icon">🗂️</span>
              <span class="mc-title">Elegir materias</span>
              <span class="mc-desc">Una o varias materias</span>
            </label>
          </div>
        </section>

        <!-- Selección de materias compartida (por_materia y examen+seleccion) -->
        <section class="modo-opcion" id="opcionPorMateria" style="display:none">
          <div class="section-label">Selecciona las materias</div>
          <div class="materias-check-grid" id="materiasCheckGrid"></div>
        </section>

        <section class="config-section params-row">
          <div class="param-group">
            <label for="cantidad">Cantidad de preguntas</label>
            <input type="number" id="cantidad" min="1" placeholder="Todas" />
          </div>

          <div class="param-group" id="tiempoConfig">
            <label for="tiempoPorPregunta">Segundos por pregunta</label>
            <input type="number" id="tiempoPorPregunta" min="5" placeholder="Sin límite" />
          </div>

          <div class="param-group" id="tiempoExamenConfig" style="display:none">
            <label for="tiempoExamen">Duración total (min)</label>
            <input type="number" id="tiempoExamen" min="1" placeholder="Ej: 30" />
          </div>
        </section>

        <button id="iniciar" class="btn-primary" type="button">▶ Iniciar cuestionario</button>
      </section>

      <div id="info" class="info-bar" style="display:none"></div>

      <section id="cuestionario" class="quiz-panel" style="display:none" aria-label="Cuestionario">
        <div class="quiz-header">
          <div class="quiz-meta-row">
            <span id="contadorPreguntas" class="q-counter"></span>
            <span id="tipoBadge" class="tipo-badge"></span>
            <span id="temporizador" class="temporizador"></span>
          </div>
          <div class="progress-bar-track">
            <div id="barraProgreso" class="progress-bar-fill"></div>
          </div>
        </div>

        <div class="pregunta-card">
          <h2 id="pregunta"></h2>

          <div id="opciones" class="opciones-grid"></div>

          <div id="zonaCompletar" class="zona-completar" style="display:none">
            <input type="text" id="inputCompletar" placeholder="Escribe tu respuesta…" autocomplete="off" />
            <button id="btnCompletar" class="btn-verificar" type="button">Verificar →</button>
          </div>

          <div id="zonaArrastrar" class="zona-arrastrar" style="display:none">
            <p class="arrastrar-hint">Toca un término y luego la definición donde pertenece.</p>
            <div class="arrastrar-layout">
              <div class="arrastrar-col" id="terminosCol">
                <div class="col-label">Términos</div>
                <div id="terminosList"></div>
              </div>
              <div class="arrastrar-col" id="definicionesCol">
                <div class="col-label">Definiciones</div>
                <div id="definicionesList"></div>
              </div>
            </div>
            <button id="btnVerificarArrastrar" class="btn-verificar" type="button" style="margin-top:16px">Verificar relaciones →</button>
          </div>

          <div id="feedback" class="feedback" style="display:none"></div>
        </div>

        <button id="siguiente" class="btn-siguiente" type="button" disabled>Siguiente →</button>
      </section>

      <section id="resultado" class="resultado-panel" style="display:none" aria-label="Resultados">
        <div class="resultado-hero">
          <div class="resultado-emoji" id="resultadoEmoji"></div>
          <h2>Resultados</h2>
          <p class="resultado-puntaje" id="puntaje"></p>
          <p class="resultado-tiempo" id="tiempoFinal"></p>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <button id="reintentar" class="btn-primary" type="button">↩ Reiniciar</button>

        <div id="resumen" class="resumen"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
  <script src="neko-arc-run.js"></script>
</body>
</html>
